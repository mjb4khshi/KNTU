{% if sarv_backlinks and sarv_backlinks|length > 0 %}
<div class="sarv-backlinks-container">
  <div class="sarv-backlinks-title">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    <span>پیوندهای ورودی به این یادداشت (Backlinks)</span>
    <span class="badge badge-soft badge-primary">{{ sarv_backlinks|length }} ارجاع</span>
  </div>

  <div class="sarv-backlinks-grid">
    {% for bl in sarv_backlinks %}
      <a href="{{ bl.url }}" class="sarv-backlink-card">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>{{ bl.title }}</span>
      </a>
    {% endfor %}
  </div>
</div>
{% endif %}
