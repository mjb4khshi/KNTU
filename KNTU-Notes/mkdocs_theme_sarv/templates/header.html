<header class="sarv-header">
  <div class="sarv-header-container">
    <!-- سمت راست: لوگو و نام سایت (کاملاً هم‌تراز با ستون ناوبری راست) -->
    <a href="{{ '' | url }}" class="sarv-header-brand">
      <div class="sarv-brand-logo">
        {% if config.theme.icon or config.theme.logo %}
        <img src="{{ (config.theme.icon or config.theme.logo) | url }}" alt="Logo">
        {% else %}
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        {% endif %}
      </div>
      <span class="sarv-brand-title">{{ config.site_name }}</span>
    </a>

    <!-- مرکز: سرچ‌بار مینیمال با افکت فوکوس از مرکز سرو -->
    <div class="sarv-header-search-wrap">
      <div class="input-wrap w-full">
        <div class="input-box">
          <div class="input-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </div>
          <input type="text" id="sarv-header-search-trigger" class="input-field" placeholder="جستجو در تمام جزوات و مباحث..." readonly>
          <div class="input-kbd">Ctrl+K</div>
        </div>
      </div>
    </div>

    <!-- سمت چپ: اکشن‌ها، سوییچر تم و دکمه موبایل -->
    <div class="sarv-header-actions">
      <!-- دکمه گراف کل دانش -->
      <button type="button" id="sarv-open-global-graph" class="btn btn-sm btn-accent sarv-graph-btn" title="مشاهده گراف ارتباطات تمام یادداشت‌ها">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>
        <span class="hidden-mobile">گراف شبکه</span>
      </button>

      <!-- دراپ‌داون سوییچ ۱۵ تم سرو -->
      <div class="sarv-select-wrap">
        <button type="button" id="sarv-theme-select-trigger" class="sarv-select-trigger">
          <span id="sarv-current-theme-dot" class="sarv-theme-dot"></span>
          <span id="sarv-current-theme-name">تم رنگی</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </button>

        <div id="sarv-theme-select-menu" class="sarv-select-menu">
          <div class="sarv-select-item" data-theme-id="persian-dark"><span class="sarv-theme-dot" style="background:#0066a4"></span> ایرانی تاریک</div>
          <div class="sarv-select-item" data-theme-id="persian-light"><span class="sarv-theme-dot" style="background:#0066a4"></span> ایرانی روشن</div>
          <div class="sarv-select-item" data-theme-id="ocean-abyss"><span class="sarv-theme-dot" style="background:#06b6d4"></span> اقیانوس ژرف</div>
          <div class="sarv-select-item" data-theme-id="emerald"><span class="sarv-theme-dot" style="background:#10b981"></span> زمردین</div>
          <div class="sarv-select-item" data-theme-id="cyberpunk"><span class="sarv-theme-dot" style="background:#00f0ff"></span> سایبرپانک</div>
          <div class="sarv-select-item" data-theme-id="sunset"><span class="sarv-theme-dot" style="background:#ff5e36"></span> غروب آفتاب</div>
          <div class="sarv-select-item" data-theme-id="matcha"><span class="sarv-theme-dot" style="background:#84cc16"></span> ماچا</div>
          <div class="sarv-select-item" data-theme-id="nordic"><span class="sarv-theme-dot" style="background:#0284c7"></span> نوردیک</div>
          <div class="sarv-select-item" data-theme-id="rose-gold"><span class="sarv-theme-dot" style="background:#e11d48"></span> رزگلد</div>
          <div class="sarv-select-item" data-theme-id="tokyo-midnight"><span class="sarv-theme-dot" style="background:#8b5cf6"></span> شب‌های توکیو</div>
          <div class="sarv-select-item" data-theme-id="coffee-roast"><span class="sarv-theme-dot" style="background:#d97706"></span> قهوه رست</div>
          <div class="sarv-select-item" data-theme-id="crimson"><span class="sarv-theme-dot" style="background:#e11d48"></span> یاقوت سرخ</div>
          <div class="sarv-select-item" data-theme-id="royal-purple"><span class="sarv-theme-dot" style="background:#8b5cf6"></span> بنفش سلطنتی</div>
        </div>
      </div>

      <!-- دکمه سوییچ حالت کانتینتری و تمام‌عرض -->
      <button type="button" id="sarv-layout-toggle" class="btn btn-sm btn-neutral sarv-layout-btn" title="تغییر عرض صفحه (کانتینتر / تمام‌عرض)">
        <svg class="sarv-icon-expand" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></svg>
        <svg class="sarv-icon-collapse" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" x2="21" y1="10" y2="3"/><line x1="10" x2="3" y1="14" y2="21"/></svg>
      </button>

      <!-- دکمه منوی موبایل -->
      <button type="button" id="sarv-mobile-menu-btn" class="btn btn-sm btn-neutral sarv-mobile-toggle" aria-label="باز کردن منو" onclick="document.getElementById('sarv-mobile-drawer').classList.add('is-open')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>
