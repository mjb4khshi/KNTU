<style>
.sarv-footer {
  margin-top: auto;
  border-top: 1px solid color-mix(in oklab, var(--color-base-500) 40%, transparent);
  background: color-mix(in oklab, var(--color-base) 85%, transparent);
  padding: 1.75rem 1.5rem;
}
.sarv-footer-content {
  max-width: 1600px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
}
.sarv-footer-info p {
  margin: 0.15rem 0;
  font-size: 0.85rem;
}
.sarv-credit {
  color: var(--color-neutral);
  font-size: 0.78rem !important;
}
.sarv-footer-socials {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  direction: ltr;
}
.sarv-social-link {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: color-mix(in oklab, var(--color-base-500) 45%, transparent);
  color: var(--color-base-content);
  transition: all 0.2s ease;
  text-decoration: none !important;
}
.sarv-social-link:hover {
  background: var(--color-primary);
  color: var(--color-primary-content);
  transform: translateY(-2px);
}
</style>
