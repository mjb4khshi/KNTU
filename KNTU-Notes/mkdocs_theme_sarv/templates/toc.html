<div class="sarv-toc-container">
  <!-- فهرست عناوین صفحه -->
  {% if page.toc %}
  <div class="sarv-toc-box">
    <div class="sarv-toc-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="21" x2="3" y1="6" y2="6"/><line x1="15" x2="3" y1="12" y2="12"/><line x1="17" x2="3" y1="18" y2="18"/></svg>
      <span>در این صفحه</span>
    </div>
    <ul class="sarv-toc-list">
      {% for item in page.toc %}
        <li class="sarv-toc-item depth-{{ item.level }}">
          <a href="{{ item.url }}" class="sarv-toc-link">{{ item.title }}</a>
        </li>
        {% for sub in item.children %}
          <li class="sarv-toc-item depth-{{ sub.level }}">
            <a href="{{ sub.url }}" class="sarv-toc-link">{{ sub.title }}</a>
          </li>
        {% endfor %}
      {% endfor %}
    </ul>
  </div>
  {% endif %}

  <!-- گراف ارتباطات این یادداشت (Local Graph) -->
  <div class="sarv-local-graph-box-wrapper">
    <div class="sarv-local-graph-header">
      <div class="sarv-toc-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>
        <span>ارتباطات این یادداشت</span>
      </div>
    </div>
    <div id="sarv-local-graph-box" class="sarv-local-graph-canvas-container">
      <div class="sarv-graph-placeholder">در حال بارگذاری گراف پیوندها...</div>
    </div>
  </div>
</div>

<style>
.sarv-toc-container {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}
.sarv-toc-box {
  background: color-mix(in oklab, var(--color-base) 75%, transparent);
  border: 1px solid color-mix(in oklab, var(--color-base-500) 45%, transparent);
  border-radius: var(--radius-card);
  padding: 1rem;
}
.sarv-toc-title {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--color-base-content);
  margin-bottom: 0.75rem;
}
.sarv-toc-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.sarv-toc-item.depth-2 { padding-right: 0; }
.sarv-toc-item.depth-3 { padding-right: 0.75rem; }
.sarv-toc-item.depth-4 { padding-right: 1.25rem; }
.sarv-toc-link {
  display: block;
  font-size: 0.8rem;
  color: color-mix(in oklab, var(--color-base-content) 70%, transparent);
  text-decoration: none !important;
  line-height: 1.5;
  transition: all 0.18s ease;
  border-right: 2px solid transparent;
  padding: 0.25rem 0.5rem 0.25rem 0.25rem;
  border-radius: 6px 0 0 6px;
}
.sarv-toc-link:hover {
  color: var(--color-primary);
  border-right-color: var(--color-primary);
  background: color-mix(in oklab, var(--color-primary) 8%, transparent);
}
.sarv-toc-link.active {
  color: var(--color-primary) !important;
  font-weight: 700 !important;
  border-right: 3px solid var(--color-primary) !important;
  background: color-mix(in oklab, var(--color-primary) 12%, transparent) !important;
}

/* Local Graph Box in Sidebar (Harmonious Theme Integration) */
.sarv-local-graph-box-wrapper {
  background: color-mix(in oklab, var(--color-base) 75%, transparent);
  border: 1px solid color-mix(in oklab, var(--color-base-500) 45%, transparent);
  border-radius: var(--radius-card);
  padding: 0.85rem;
  overflow: hidden;
}
.sarv-local-graph-canvas-container {
  width: 100%;
  height: 200px;
  position: relative;
  background: color-mix(in oklab, var(--color-base-500) 18%, var(--color-base));
  border: 1px solid color-mix(in oklab, var(--color-base-500) 50%, transparent);
  border-radius: 12px;
  overflow: hidden;
}
.sarv-graph-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  font-size: 0.75rem;
  color: var(--color-neutral);
}
</style>

<script>
(function() {
  function setupTocScrollspy() {
    const links = document.querySelectorAll('.sarv-toc-link');
    if (!links.length) return;

    const headingEntries = [];
    links.forEach(link => {
      const href = link.getAttribute('href');
      if (href && href.startsWith('#')) {
        const id = decodeURIComponent(href.slice(1));
        const el = document.getElementById(id);
        if (el) {
          headingEntries.push({ id, el, link });
        }
      }
    });

    if (!headingEntries.length) return;

    function onScroll() {
      const scrollY = window.scrollY;
      const headerOffset = 110;
      let activeEntry = headingEntries[0];

      for (let i = 0; i < headingEntries.length; i++) {
        const top = headingEntries[i].el.getBoundingClientRect().top + scrollY;
        if (scrollY + headerOffset >= top - 25) {
          activeEntry = headingEntries[i];
        } else {
          break;
        }
      }

      headingEntries.forEach(entry => {
        if (entry === activeEntry) {
          entry.link.classList.add('active');
        } else {
          entry.link.classList.remove('active');
        }
      });
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupTocScrollspy);
  } else {
    setupTocScrollspy();
  }
})();
</script>
